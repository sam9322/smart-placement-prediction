services:
  - type: web
    name: smart-placement-coach
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    plan: free
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SQLITE_DB_PATH
        value: /data/database.db
      - key: PYTHON_VERSION
        value: 3.11.6
